name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Every leg runs to completion: a Windows-only failure is the whole reason
      # for having the leg, and cancelling the others hides whether it is
      # platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: typecheck, strict
        run: npm run typecheck
      - name: tests
        run: npm test
      - name: the extension manifest is valid json and keeps its pinned id
        shell: bash
        run: |
          node -e "
          const m = JSON.parse(require('node:fs').readFileSync('extension/manifest.json','utf8'));
          const { EXTENSION_ID } = await import('./dist/install.js');
          const crypto = require('node:crypto');
          const der = Buffer.from(m.key, 'base64');
          const hash = crypto.createHash('sha256').update(der).digest();
          const id = [...hash.subarray(0,16)].map(b=>b.toString(16).padStart(2,'0')).join('')
            .split('').map(c=>String.fromCharCode(97 + parseInt(c,16))).join('');
          if (id !== EXTENSION_ID) {
            throw new Error('manifest key derives id ' + id + ' but install.ts allowlists ' + EXTENSION_ID);
          }
          console.log('manifest key derives the allowlisted id:', id);
          "
